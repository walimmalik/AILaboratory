name: UI QA

# A GPT agent tests the running app in a browser: the screens the PR touches, a smoke pass over the
# rest, failures, UX and information overload. Posted as one PR comment that is updated on each push,
# with screenshots as a run artifact. Advisory: not a required check. Prompt: .github/codex/ui-qa.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/**
      - packages/**
      - seed/**
      - compose.yaml
      - pnpm-lock.yaml
      - .github/codex/**
      - .github/workflows/ui-qa.yml

concurrency:
  group: ui-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://ailab:ailab-dev-only@localhost:5432/ailab
  SCIENCE_URL: http://localhost:8001
  QA_FILES_DIR: ${{ github.workspace }}/.qa-files
  # A throwaway lab in a throwaway container; the agent signs in with these.
  BOOTSTRAP_ORG: Demo Org
  BOOTSTRAP_LAB: Demo Lab
  BOOTSTRAP_USER: QA tester
  BOOTSTRAP_EMAIL: qa@lab.local
  BOOTSTRAP_PASSWORD: qa-only-password

jobs:
  qa:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-codex') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Write the PR's diff and description for the tester
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .codex-pr qa-shots "$QA_FILES_DIR"
          chmod 777 "$QA_FILES_DIR" qa-shots
          git diff HEAD^1 HEAD > .codex-pr/pr.diff
          git diff --stat HEAD^1 HEAD > .codex-pr/pr.stat
          printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > .codex-pr/description.md
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack (Postgres, API, science, web on :8080)
        env:
          QA_OPENROUTER_API_KEY: ${{ secrets.QA_OPENROUTER_API_KEY }}
          QA_AGENT_PROVIDER: ${{ secrets.QA_OPENROUTER_API_KEY != '' && 'openrouter' || '' }}
          QA_AGENT_MODEL: ${{ vars.QA_AGENT_MODEL }}
        run: |
          docker compose -f compose.yaml -f .github/codex/compose.qa.yaml up -d --build --wait
          for url in http://localhost:3001/health http://localhost:8001/health http://localhost:8080; do
            timeout 180 bash -c "until curl -fsS $url > /dev/null; do sleep 2; done"
          done
      - name: Create the lab and its first user
        run: pnpm --filter @ailab/api bootstrap | grep -v -e "API token" -e "Password"
      - name: Load the seed lab (drafts and proposals to review)
        env:
          FILE_STORE_DIR: ${{ env.QA_FILES_DIR }}
        run: |
          umask 000
          pnpm --filter @ailab/api seed
      - name: Say so when the OpenAI key is missing
        if: env.HAS_OPENAI_KEY != 'true'
        run: echo "::notice::Add the OPENAI_API_KEY secret to run Codex (see .github/codex/README.md)"
      - name: Run the tester
        if: env.HAS_OPENAI_KEY == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CODEX_MODEL || 'gpt-sol-6.1' }}
          effort: ${{ vars.CODEX_QA_EFFORT || 'medium' }}
          sandbox: read-only
          prompt-file: .github/codex/ui-qa.md
          # The browser: Playwright's MCP server driving the runner's Chrome. MCP servers run outside
          # Codex's sandbox, so it can reach the app while Codex itself stays read-only.
          codex-args: >-
            ["-c", "mcp_servers.playwright.command=\"npx\"",
             "-c", "mcp_servers.playwright.args=[\"-y\", \"@playwright/mcp@0.0.83\", \"--headless\", \"--isolated\", \"--browser=chrome\", \"--viewport-size=1440x900\", \"--output-dir=${{ github.workspace }}/qa-shots\"]",
             "-c", "mcp_servers.playwright.startup_timeout_sec=120",
             "-c", "mcp_servers.playwright.tool_timeout_sec=120"]
      - name: API and web logs
        if: always()
        run: docker compose -f compose.yaml -f .github/codex/compose.qa.yaml logs api web science > qa-shots/stack.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-qa-screenshots
          path: qa-shots
          if-no-files-found: ignore

  comment:
    needs: qa
    if: needs.qa.outputs.report != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.qa.outputs.report }}
        with:
          script: |
            const marker = '<!-- codex-ui-qa -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n## UI QA\n\n${process.env.REPORT}\n\n---\n_Tested ${sha} in a browser · screenshots and logs under "ui-qa-screenshots" in the [run](${run})_`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
