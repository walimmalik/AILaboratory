name: Codex review

# A GPT code review of every pull request, posted as one PR comment that is updated on each push.
# Advisory: not a required check. Prompt: .github/codex/review.md. Setup: .github/codex/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skipped with the "skip-codex" label, and on forks (they get no secrets).
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-codex') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    outputs:
      report: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Write the PR's diff and description for Codex
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .codex-pr
          # The merge commit's first parent is the base branch, so this is exactly what the PR changes.
          git diff HEAD^1 HEAD > .codex-pr/pr.diff
          git diff --stat HEAD^1 HEAD > .codex-pr/pr.stat
          printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > .codex-pr/description.md
      - name: Say so when the OpenAI key is missing
        if: env.HAS_OPENAI_KEY != 'true'
        run: echo "::notice::Add the OPENAI_API_KEY secret to run Codex (see .github/codex/README.md)"
      - name: Run Codex
        if: env.HAS_OPENAI_KEY == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CODEX_MODEL || 'gpt-sol-6.1' }}
          effort: ${{ vars.CODEX_REVIEW_EFFORT || 'high' }}
          sandbox: read-only
          prompt-file: .github/codex/review.md

  comment:
    needs: review
    if: needs.review.outputs.report != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.review.outputs.report }}
        with:
          script: |
            const marker = '<!-- codex-review -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n## Codex review\n\n${process.env.REPORT}\n\n---\n_Reviewed ${sha} · [run](${run})_`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
