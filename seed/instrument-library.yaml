  assumed: [category, performedBy, capabilities]
  attributes:
    category: manual_station
    performedBy: person
    capabilities:
      - {capability: transfer, limits: {note: "Hand pipettes, single and multichannel."}}
      - {capability: dispense}
      - {capability: move_labware}
      - {capability: delid}
      - {capability: relid}
      - {capability: seal, limits: {note: "Adhesive seals by hand; no heat."}}
      - {capability: peel}
      - {capability: wash, limits: {note: "Manual plate washing, e.g. ELISA washes with a multichannel or wash bottle."}}

