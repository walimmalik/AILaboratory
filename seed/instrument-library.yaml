# The lab's workcells (plan 008d): member instruments by key, each mapped to its device in the
# echo650-twin (device IDs from its catalog: echo650, precisedrop, mantis, a4s, xpeel,
# imported-microspin, and the FlexPod's own orient and lidvalet sites). The mapping is assumed
# until the twin connection (plan 015) checks it.
workcells:
  - key: flexpod-workcell
    label: FlexPod workcell
    twin: echo650-twin flexpod
    notes: "The FlexPod with the PlateOrient and two 12-position stackers on it, and the Echo, PreciseDrop, LidValet, Mantis, A4S, XPeel and MicroSpin around it, scheduled by Cellario. The Spark Cyto and Cytomat stand alone."
    members:
      - {instrument: flexpod-01, twinDevice: flexpod, byHand: false}
      - {instrument: plateorient-01, twinDevice: flexpod.orient, byHand: false}
      - {instrument: lidvalet-01, twinDevice: flexpod.lidvalet, byHand: false}
      - {instrument: echo-01, twinDevice: echo650, byHand: true}
      - {instrument: precisedrop-01, twinDevice: precisedrop, byHand: true}
      - {instrument: mantis-01, twinDevice: mantis, byHand: true}
      - {instrument: a4s-01, twinDevice: a4s, byHand: true}
      - {instrument: xpeel-01, twinDevice: xpeel, byHand: true}
      - {instrument: microspin-01, twinDevice: imported-microspin, byHand: true}
