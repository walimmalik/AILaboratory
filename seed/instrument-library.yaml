# Instrument and equipment kinds in the shape the instrument library stores them (plan 008a, ADR 0025).
# The research behind every value, with sources and verified/estimated/unknown labels, is in
# instruments.yaml; `research` names the entry there. The loader cites that entry's first source URL
# as datasheet evidence for each attribute, except the attributes listed under `assumed`, which load
# as assumed (an estimate, or a layout choice nobody has checked against the instrument yet).
# Unknown values are left out, so readiness lists them.
#
# Fit tags pair equipment with mounts: equipment whose `fits` names a tag a mount `accepts` can go on it.

instrument_kinds:

- key: hamilton-star
  research: hamilton-star
  label: Hamilton Microlab STAR
  manufacturer: Hamilton
  assumed: [mounts]
  attributes:
    model: Microlab STAR
    variants: [Microlab STARlet, Microlab STAR, Microlab STARplus]
    category: liquid_handler
    performedBy: machine
    footprint: {width: {value: "1664", unit: mm}, depth: {value: "781", unit: mm}, height: {value: "903", unit: mm}}
    weight: {value: "145", unit: kg}
    mounts:
      - {id: tracks, label: deck tracks, layout: {layout: rail, tracks: 54, pitch: {value: "22.5", unit: mm}}, accepts: [hamilton_track], changedBy: operator}
      - {id: channels, label: pipetting arm, layout: {layout: fixed}, accepts: [star_channels], changedBy: factory}
      - {id: head, label: multi-probe head mount, layout: {layout: fixed}, accepts: [star_head], changedBy: service}
      - {id: gripper, label: gripper, layout: {layout: fixed}, accepts: [star_gripper], changedBy: service}
      - {id: arm, label: plate handling arm, layout: {layout: fixed}, accepts: [star_iswap], changedBy: service}
    controlInterfaces: [VENUS, PyLabRobot STARBackend]
    notes: "Tracks and pitch are for the STAR (54 tracks); a STARlet has 30. Carriers take a run of tracks and carry the plate positions."

