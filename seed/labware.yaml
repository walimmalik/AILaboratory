# Labware types (real catalog items, plan 007). Fields not in `status` are verified.
# Researched 2026-09-29 from manufacturer product pages, datasheets and the Opentrons
# shared-data labware definitions (github.com/Opentrons/opentrons, branch edge,
# shared-data/labware/definitions/2/<loadName>/<version>.json).
#
# Conventions
#   - Every quantity is {value: "<string>", unit: "<unit>"}.
#   - status per field: verified  = read on a manufacturer page/datasheet (or the Opentrons
#                                    definition when it lists this exact catalog number),
#                       estimated = derived from a sibling product, a secondary source or reasoning,
#                       unknown   = not found; value left null.
#   - "opentrons_def" dimensions are Opentrons' measured definition values. Opentrons publishes
#     them for the catalog numbers listed in the definition's brandId, so they count as verified
#     only for those numbers.
#   - Instruments in the owner's lab: Hamilton STAR + VANTAGE, Opentrons Flex, Echo 650,
#     Formulatrix Mantis, Analytik Jena CyBio FeliX, Tecan Spark Cyto, BlueCatBio BlueWasher,
#     Analytik Jena qTOWER3, Bio-Rad thermocyclers. (No OT-2: OT-2 tips dropped.)

