# =============================================================================
# GAPS AND CAVEATS
# - Echo 384PP / 384LDV / 6RES: Beckman pages publish no plate or well dimensions; well geometry
#   is unknown. Echo dead volume taken as the minimum working volume; brochure and an Echo 650 SOP
#   disagree by 5 uL for 384PP (20 vs 15 uL). Confirm against the lab's Echo plate-type table.
# - Echo 6RES (001-11101) is listed for Echo 525 only; likely not usable on the lab's Echo 650.
# - Hamilton 56695-01 is the 200 mL reservoir; the 60 mL is 56694-01. Hamilton 235940 not
#   confirmed; 235905 is the 1000 uL filter tip. No Hamilton VENUS labware file names were
#   confirmed from a Hamilton source (STF_L / HTF_L are community-standard names, estimated).
# - Thermo 442404 MaxiSorp: no plate/well dimensions found (customer drawing not located).
# - Greiner 655090, 780270, Analytik Jena 844-70292-0, Axygen RES-SW96-HP: partial or no
#   dimensional data; dead volumes for reservoirs are not published and are unknown/estimated.
# - Corning 3570/3764/3765 geometry assumed equal to Corning's standard 384 flat-bottom drawing
#   (these numbers are not listed on the drawing). No official Opentrons definition names them.
# - HSP9655 on qTOWER3: compatibility not confirmed by either vendor.
# - Mantis LV chip SKU and CyBio tip lengths not found.
# - Not researched: plate lids (e.g. Corning 3099), sealing films, Matrix 2D-barcoded tube racks,
#   Opentrons OT-2 tips (dropped: owner has no OT-2), Agilent 201252-100 290 mL reservoir
#   (Opentrons definition exists: agilent_1_reservoir_290ml).
# =============================================================================
