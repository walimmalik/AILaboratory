# Reagent products and kits (real catalog items, plan 009), then the demo lab's lots.
# Researched 2026-09-29 from vendor product pages, datasheets and technical manuals (WebFetch).
#
# Conventions
#   quantity: {value: "<string>", unit: <one of: L mL uL nL g mg ug ng M mM uM nM mg/mL ug/mL ng/mL pg/mL
#              g/mol s min h d degC %v/v %w/v cells/mL U/mL>}
#   Counts (reactions, preps, plates, vials, assays) are not units in the app's list, so they are given as
#   plain `count:` strings with a `count_of:` noun.
#   Ratios (reagent:medium, dilution factors) are given as strings like "1:1", "1:100".
#   status.<field>: verified   = read on a primary source (vendor page, datasheet, manual) listed in source_urls
#                   estimated  = general lab knowledge / convention, NOT read on a primary source this session
#                   unknown    = not found; do not invent
#   handling_rules[].source: vendor | lab_convention
#   liquid_behaviour hints are estimated unless a source is cited.

products:

  # ---------------------------------------------------------------- ELISA (IL-6 sandwich, 96-well)
  - key: rnd-dy206
    vendor: R&D Systems (Bio-Techne)
    catalog_number: DY206
    catalog_variants:
      - {catalog_number: DY206, plates: "15"}
      - {catalog_number: DY206-05, plates: "5"}
    name: Human IL-6 DuoSet ELISA
    category: elisa_development_kit
    pack_size: {count: "15", count_of: 96-well plates}
    assay_range: {low: {value: "9.38", unit: pg/mL}, high: {value: "600", unit: pg/mL}}
    standard_curve:
      top_concentration: {value: "600", unit: pg/mL}
      points: "7"
      dilution: "2-fold serial in Reagent Diluent"
    sample_types: [cell culture supernates, serum, plasma]
    components:
      - name: Capture Antibody (mouse anti-human IL-6)
        part_number: "840113"
        amount: lot-specific
        reconstitute_with: {volume: {value: "0.5", unit: mL}, diluent: PBS}
        stock_concentration: per Certificate of Analysis (lot-specific)
        working_concentration: per Certificate of Analysis (lot-specific)
        coating_diluent: PBS
      - name: Detection Antibody (biotinylated anti-human IL-6)
        part_number: "840114"
        amount: lot-specific
        reconstitute_with: {volume: {value: "1.0", unit: mL}, diluent: Reagent Diluent}
        stock_concentration: per Certificate of Analysis (lot-specific)
        working_concentration: per Certificate of Analysis (lot-specific)
      - name: Recombinant Human IL-6 Standard
        part_number: "840115"
        amount: lot-specific
        reconstitute_with: {volume: {value: "0.5", unit: mL}, diluent: deionized water}
        stock_concentration: per Certificate of Analysis (lot-specific)
      - name: Streptavidin-HRP B
        part_number: "893975"
        volume: {value: "2.0", unit: mL}
        working_dilution: per vial label (lot-specific)
        diluent: Reagent Diluent
    storage_temperature: {min: {value: "2", unit: degC}, max: {value: "8", unit: degC}}
    handling_rules:
      - {rule: reconstitution_rest, text: "Let all components sit >= 15 min with gentle agitation after initial reconstitution", duration: {value: "15", unit: min}, source: vendor}
      - {rule: detection_antibody_rest, text: "Store reconstituted Detection Antibody at least overnight at 2-8 degC before use the next day", source: vendor}
      - {rule: light, text: "Streptavidin-HRP and substrate steps: avoid direct light", source: vendor}
      - {rule: time_to_read, text: "Read immediately after Stop Solution at 450 nm; correction 540 or 570 nm", source: vendor}
      - {rule: expiry, text: "Do not use past expiration date", source: vendor}
    protocol_timings:
      coating: "overnight, room temperature"
      blocking: {value: "1", unit: h, qualifier: minimum, temperature: room temperature}
      samples_standards: {value: "2", unit: h}
      detection_antibody: {value: "2", unit: h}
      streptavidin_hrp: {value: "20", unit: min, light: avoid direct light}
      substrate: {value: "20", unit: min, light: avoid direct light}
      read: {wavelength_nm: "450", correction_nm: "540 or 570", timing: immediately after stop}
    ancillary_named_in_datasheet:
      plate: DY990
      wash_buffer: "WA126 (0.05% Tween 20 in PBS, pH 7.2-7.4)"
      reagent_diluent: "DY995 (1% BSA in PBS, pH 7.2-7.4, 0.2 um filtered)"
      substrate: DY999B
      stop_solution: "DY994B (methanesulfonic acid)"
    hazards: unknown
    source_urls:
      - https://www.rndsystems.com/products/human-il-6-duoset-elisa_dy206
      - https://resources.rndsystems.com/pdfs/datasheets/dy206.pdf
    status:
      catalog_number: verified
      pack_size: verified
      components: verified
      component_concentrations: unknown
      standard_top_concentration: verified
      assay_range: verified
      storage_temperature: verified
      protocol_timings: verified
      hazards: unknown
    notes: >
      Current datasheet gives capture/detection/standard amounts and working concentrations only "per Certificate
      of Analysis" (lot-specific), so no numbers are recorded here; they belong on the Lot record. Top standard
      600 pg/mL is inferred from the stated assay range 9.38-600 pg/mL with a 7-point 2-fold series
      (600/2^6 = 9.375), consistent with the range. Datasheet now names DY994B methanesulfonic acid stop solution,
      not 2N H2SO4. Reconstituted-component shelf life after reconstitution not stated on the pages read.

