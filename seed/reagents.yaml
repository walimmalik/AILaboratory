# - DY008 is discontinued; DY008B is recorded. DY008B stop-solution identity and DY999B vial volume are unknown.
# - Sigma product pages (A7906, P1379) returned 404 to the fetcher. A7906 storage (2-8 degC) is estimated;
#   Tween 20 data comes from Sigma's P9416 information sheet, which names P1379 as the general-use grade.
# - DMSO D2650 storage conflict: information sheet says room temperature, product page summary said ~4 degC.
# - Qubit HS storage conflict: user guide says reagent at 2-8 degC, current product page says room temperature.
# - Staurosporine DMSO solubility read as 0.5 mg/mL (~1 mM) from Cayman; re-check before seeding 10 mM stocks.
#   Light sensitivity unknown. Sigma S4400 not researched.
# - Selleck library: page gives L1300 (FDA-approved Drug Library, 3,199 compounds); L1700 not checked.
# - Hazards/GHS: few items have primary-source GHS codes; most hazards are marked estimated or unknown.
