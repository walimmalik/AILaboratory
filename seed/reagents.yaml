    storage_temperature: {min: {value: "-30", unit: degC}, max: {value: "-10", unit: degC}}
    storage_long_term_preferred: {max: {value: "-65", unit: degC}, text: "for maximum light signal"}
    handling_rules:
      - {rule: light, text: "Light-sensitive; store in an opaque container", light_sensitive: true, source: vendor}
      - {rule: stability_at_4C, text: ">85% light output after 2 months at 4 degC", duration: {value: "60", unit: d}, temperature: {value: "4", unit: degC}, source: vendor}
      - {rule: stability_at_room_temperature, text: ">85% light output after 7 days at room temperature", duration: {value: "7", unit: d}, source: vendor}
      - {rule: freeze_thaw, text: "Withstands 4 additional freeze-thaw cycles after the first thaw with no loss; do not refreeze after extended storage above recommended temperature", max_additional_cycles: "4", source: vendor}
      - {rule: thaw, text: "Thaw overnight at 4 degC or in a 22 degC water bath; do not exceed 25 degC", max_temperature: {value: "25", unit: degC}, source: vendor}
      - {rule: equilibrate_reagent, text: "~30 min for 100 mL, ~100 min for 500 mL to reach room temperature", duration: {value: "30", unit: min}, source: vendor}
