    - https://www.beckman.com/liquid-handlers/echo-acoustic
    - https://store.beckman.com/en/p/echo-650-series-acoustic-liquid-handlers/001-16079
    - https://www.emeraldcloudlab.com/helpfiles/experimentacousticliquidhandling
