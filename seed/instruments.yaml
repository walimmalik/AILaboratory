# =============================================================================================
# GAPS (not confirmed from a primary source)
# - Hamilton: official STAR track count conflicts on hamiltoncompany.com ("up to 66"); STARplus
#   tracks disagree across sources (71 / 76 / 82). Carrier details come from PyLabRobot, not Hamilton.
# - Hamilton VANTAGE: per-channel/per-head volume ranges; whether iSWAP is offered.
# - Opentrons Flex: thermocycler sample volume and slots occupied; gripper payload/force;
#   Magnetic Block numeric specs.
# - Echo 650: max volume per transfer; named fluid-class codes (DMSO, AQ_BP, CP, SP, GP...);
#   Echo 555 specs. Weight conflict 117 vs 130 kg.
# - Mantis: footprint looks wrong (350 x 232 x 212 mm); chip-to-dead-volume mapping inferred.
# - PreciseDrop II: current manufacturer relationship (Let's Go Robotics vs HighRes); footprint;
#   min volume 50 vs 80 nL.
# - Tecan Spark Cyto: absorbance/fluorescence ranges from a core-facility page; shaking; footprint;
#   configuration names.
# - BlueWasher: all numbers from a reseller; manufacturer site unreachable.
# - CyBio FeliX: head minimum volumes (except SELECT 8/50); weight.
# - qTOWER3: gradient range for G variants; optics wavelengths; standard-model specs from reseller.
# - Bio-Rad: model choice (C1000 Touch, T100) is assumed; lid temperature ranges; T100 volume range.
# - HighRes LidValet / PlateOrient: no numeric specs published. FlexPod robot arm model unknown.
# - Cytomat 10: weight; per-cassette capacity breakdown; O2 option.
# - Cellario: no public per-model driver list; only HighRes' own devices are marked supported.
# - degC/s (ramp rates) is used but is not in the unit registry yet.
# =============================================================================================

