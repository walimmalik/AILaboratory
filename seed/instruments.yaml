- key: opentrons-flex
  manufacturer: Opentrons
  model: Opentrons Flex
  category: liquid_handler
  capabilities: [transfer, dispense, grip_move]   # heat/cool/shake/thermocycle/read_absorbance come from modules
  specs:
    deck_slots_working: 12      # A1-D3, pipettes + gripper
    deck_slots_staging: 4       # A4-D4, gripper only
    footprint: {width: {value: "870", unit: "mm"}, depth: {value: "690", unit: "mm"}, height: {value: "840", unit: "mm"}}
    weight: {value: "88.5", unit: "kg"}
  pipettes:   # mount options; each is a kind the instance installs
    - {name: "Flex 1-Channel 50 uL", channels: 1, min: {value: "1", unit: "uL"}, max: {value: "50", unit: "uL"}}
    - {name: "Flex 1-Channel 1000 uL", channels: 1, min: {value: "5", unit: "uL"}, max: {value: "1000", unit: "uL"}}
    - {name: "Flex 8-Channel 50 uL", channels: 8, min: {value: "1", unit: "uL"}, max: {value: "50", unit: "uL"}}
    - {name: "Flex 8-Channel 1000 uL", channels: 8, min: {value: "5", unit: "uL"}, max: {value: "1000", unit: "uL"}}
    - {name: "Flex 96-Channel 200 uL", channels: 96, min: {value: "1", unit: "uL"}, max: {value: "200", unit: "uL"}}
    - {name: "Flex 96-Channel 1000 uL", channels: 96, min: {value: "5", unit: "uL"}, max: {value: "1000", unit: "uL"}}
  modules:
    - name: Heater-Shaker Module GEN1
      capabilities: [heat, shake]
      temp_range: {min: "ambient + 1.5 degC", max: {value: "95", unit: "degC"}}
      temp_step: {value: "1", unit: "degC"}
      temp_accuracy: {value: "0.5", unit: "degC", note: "+/- at 55 degC"}
      shake_speed: {min: {value: "200", unit: "rpm"}, max: {value: "3000", unit: "rpm"}}
      orbit_diameter: {value: "2", unit: "mm"}
      dimensions: {length: {value: "152", unit: "mm"}, width: {value: "90", unit: "mm"}, height: {value: "82", unit: "mm"}}
      robots: [Flex (with Flex Heater-Shaker Caddy), OT-2]
    - name: Temperature Module GEN2
      capabilities: [heat, cool]
      temp_range: {min: {value: "4", unit: "degC"}, max: {value: "95", unit: "degC"}}
      robots: [Flex (with Flex Temperature Caddy), OT-2]
    - name: Thermocycler Module GEN2
      capabilities: [thermocycle, heat, cool]
      block_temp_range: {min: {value: "4", unit: "degC"}, max: {value: "99", unit: "degC"}}
      lid_temp_range: {min: {value: "37", unit: "degC"}, max: {value: "110", unit: "degC"}}
      max_heating_rate: {value: "4.25", unit: "degC/s", note: "ambient to 95 degC"}
      max_cooling_rate: {value: "2.0", unit: "degC/s", note: "95 degC to ambient"}
      plate_format: "96-well"
    - name: Magnetic Block GEN1
      capabilities: [hold]   # unpowered magnet for bead separation; no plain-verb match in the list
      powered: false
    - name: Absorbance Plate Reader Module GEN1
      capabilities: [read_absorbance]
      wavelengths_nm: ["450", "562", "600", "650"]
      od_range: {min: "0.0", max: "4.0", resolution: "0.001"}   # OD is unitless
      plate_format: "96-well flat bottom"
      robots: [Flex]
  configurability:
    type: modular
    slots:
      - {name: left_mount, options: [1- or 8-channel pipettes above], changeable: user}
      - {name: right_mount, options: [1- or 8-channel pipettes above], changeable: user}
      - {name: both_mounts, options: ["96-channel pipette occupies both mounts"], changeable: user}
      - {name: gripper, options: [none, Flex Gripper GEN1], changeable: user}
      - {name: deck_slots, options: "A1-D3 labware, modules, trash bin (A1-D1, A3-D3), waste chute (D3 only)", changeable: user_between_runs}
      - {name: staging_area_slots, options: "A4-D4 via Staging Area Slot fixtures; incompatible with a powered module in column 3 of the same row", changeable: user_between_runs}
  control_interfaces:
    - Opentrons Python Protocol API v2 (protocols must load trash bin fixtures from API 2.16)
    - Opentrons App / Protocol Designer
    - PyLabRobot opentrons.Flex (support "basic"; 1-channel and 96-channel heads unverified per PLR notes)
    - Cellario: unknown
  source_urls:
    - https://opentrons.com/products/flex
    - https://docs.opentrons.com/python-api/deck-slots/
    - https://opentrons.com/products/heater-shaker-module
    - https://opentrons.com/products/temperature-module-gen2
    - https://docs.opentrons.com/flex/modules/thermocycler/
    - https://opentrons.com/products/opentrons-flex-absorbance-plate-reader-module
    - https://opentrons.com/products/opentrons-flex-gripper-gen1
    - https://docs.opentrons.com/v2/new_modules.html
  status:
    deck_slots: verified
    footprint: verified
    weight: verified
    pipettes: verified
    heater_shaker: verified
    temperature_module: verified
    thermocycler_gen2: verified
    thermocycler_sample_volume: unknown
    thermocycler_deck_slots_occupied: unknown
    magnetic_block: verified        # "unpowered module" per Opentrons API docs; no numeric specs taken
    absorbance_reader: verified
    gripper_specs: unknown          # product page gives supported labware only, no force/payload
    pylabrobot: verified
  notes:
    - "Flex product page lists the 96-channel low-volume pipette as '1-200 uL'."
    - "Absorbance Plate Reader is not sold in European Patent Convention states (per Opentrons page)."
    - "Heater-Shaker minimum is relative to room temperature (ambient + 1.5 degC); store it as a relative constraint, not a fixed number."
    - "Gripper-optimized labware (Opentrons page): NEST 2 mL 96 deep well V-bottom, Opentrons Tough 0.2 mL 96 PCR full skirt, NEST 96 flat, all Flex tip racks."
    - "Thermocycler occupies several slots on Flex (commonly A1+B1); not confirmed from a fetched page."

