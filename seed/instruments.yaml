    max_drop_rate: verified
    transfer_volume_max: unknown
    footprint: verified
    weight: verified
    source_labware: verified
    destination_labware: verified
    fluid_types: verified
    fluid_classes_named_in_software: unknown
    echo_525_differences: verified
    echo_555_differences: unknown
  notes:
    - "Weight conflict: Beckman store page for Echo 650 (001-16079) says 130 kg; the 650 Plus series page says 117 kg (258 lb). 117 kg used for 650 Plus."
    - "Emerald Cloud Lab (secondary) describes 200-500 drops/s giving 500 nL/s to 1.25 uL/s, and calibration groups DMSO / Glycerol / AqueousWithSurfactant / AqueousWithoutSurfactant; these are ECL's labels, not Beckman fluid-class codes."
    - "Echo transfers are integer multiples of 2.5 nL; no maximum per transfer is stated on the fetched pages."

