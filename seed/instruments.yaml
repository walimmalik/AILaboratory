# Instrument kinds (real models, plan 008) and the demo lab's registered instruments.
# Kinds: researched 2026-09-29 from manufacturer pages and datasheets. "verified" = read on a
# manufacturer page or PDF; "estimated" = secondary source (reseller, core facility, PyLabRobot)
# or a conversion; "unknown" = not found and left blank on purpose. Fields not in `status` are verified.
# Units beyond the current registry (added by plans 007/008): mm, nm, rpm, xg, kg, degC/s.
# PyLabRobot support levels come from PyLabRobot docs/_static/devices.json (main, 2026-09-29):
#   wip < basic < mostly < full.
# Cellario: HighRes publishes no per-model driver list, so Cellario support is only marked
#   verified for HighRes' own devices.

kinds:

# ---------------------------------------------------------------------------------------------
- key: hamilton-star
  manufacturer: Hamilton
  model: Microlab STAR
  variants: [Microlab STARlet, Microlab STAR, Microlab STARplus]
  category: liquid_handler
  capabilities: [transfer, dispense, grip_move]
  specs:
    deck_tracks:
      STARlet: 30
      STAR: 54
    track_pitch: {value: "22.5", unit: "mm"}
    ansi_slas_positions:
      STARlet: 25
      STAR: 55
    channels_1000uL_max: 16
    channels_5mL_max: 8
    volume_range_1000uL_channel: {min: {value: "0.5", unit: "uL"}, max: {value: "1", unit: "mL"}}
    volume_range_5mL_channel: {min: {value: "50", unit: "uL"}, max: {value: "5", unit: "mL"}}
    volume_range_core96_head: {min: {value: "1", unit: "uL"}, max: {value: "1000", unit: "uL"}}
    volume_range_core384_head: {min: {value: "0.1", unit: "uL"}, max: {value: "50", unit: "uL"}}
    footprint:
      STARlet: {width: {value: "1124", unit: "mm"}, height: {value: "903", unit: "mm"}, depth: {value: "781", unit: "mm"}}
      STAR: {width: {value: "1664", unit: "mm"}, height: {value: "903", unit: "mm"}, depth: {value: "781", unit: "mm"}}
    weight:
      STARlet: {value: "135", unit: "kg"}
      STAR: {value: "145", unit: "kg"}
  configurability:
    type: modular
    slots:
      - name: pipetting_arm_channels
        options: ["2-16 independent 1000 uL channels", "up to 8 independent 5 mL channels"]
        changeable: factory_or_service   # installed configuration of the instance
      - name: multi_probe_head
        options: [none, CO-RE 96 Probe Head, CO-RE 384 Probe Head]   # STAR: "96 and/or 384"; STARlet: "96 or 384"
        changeable: factory_or_service
      - name: iswap
        options: [none, iSWAP]   # articulating plate-gripper arm, reaches both sides of the deck
        changeable: factory_or_service
      - name: core_gripper
        options: [none, CO-RE Gripper]   # tool picked up by two pipetting channels during a run
        changeable: runtime_tool
      - name: autoload
        options: [none, "Autoload with 1D barcode", "Autoload with 1D+2D barcode"]
        changeable: factory_or_service
      - name: deck_carriers
        description: >-
          Deck is 54 tracks (STAR) at 22.5 mm pitch; carriers slide onto tracks and are changed
          by the user between runs. Typical: PLT_CAR_L5AC (5 plate positions, 135 mm = 6 tracks
          wide), TIP_CAR_480 (5 tip-rack positions, 6 tracks), RGT_CAR (reagent trough carriers).
        changeable: user_between_runs
  control_interfaces:
    - VENUS (Hamilton method software)
    - PyLabRobot STARBackend (firmware-level; support "full" for STAR and STARlet)
    - Cellario: unknown (no public per-model list)
  source_urls:
    - https://www.hamiltoncompany.com/microlab-star
    - https://www.analitykgenetyka.pl/sites/default/files/2_microlab_star_brochure_0.pdf
    - https://www.epfl.ch/research/facilities/gene-expression-core-facility/wp-content/uploads/2018/08/Microlab-STAR-Brochure.pdf
    - https://www.bostonind.com/hamilton-microlab-star-line-configuration-guide-starlet-star-starplus
    - https://github.com/PyLabRobot/pylabrobot/blob/main/pylabrobot/resources/hamilton/hamilton_decks.py
    - https://github.com/PyLabRobot/pylabrobot/blob/main/pylabrobot/resources/hamilton/plate_carriers.py
  status:
    deck_tracks: verified            # Hamilton brochure (hosted by distributor) 30/54; PyLabRobot constants agree
    track_pitch: estimated           # PyLabRobot _TRACK_WIDTH = 22.5 mm, not read in a Hamilton doc
    ansi_slas_positions: verified
    channels: verified
    volume_ranges: verified          # Hamilton brochure PDF (distributor-hosted)
    footprint: verified              # width from hamiltoncompany.com; H x D from brochure (35.5 x 31.2 in) converted
    weight: verified                 # "8 ch." configuration
    configurability: verified
    deck_carriers: estimated         # carrier names/widths from PyLabRobot resource library
    pylabrobot: verified
  notes:
    - "hamiltoncompany.com spec table says 'Up to 66 tracks' for both STARlet and STAR, which conflicts with the brochure (30/54/STARplus 82) and PyLabRobot (30/54/76). Use 54 for STAR; flag the STARplus count as unconfirmed."
    - "Hamilton's site gives depth as '78.1-1.01 m' (range depends on options). Brochure: 31.2 in = ~792 mm; 781 mm used as the base depth from the Hamilton page."
    - "Hamilton's site gives one overall pipetting range '1 uL - 5000 uL'; the per-channel ranges above come from the Hamilton brochure."
    - "iSWAP is not listed on the current hamiltoncompany.com spec table but is described in both brochures."
    - "PyLabRobot uses 'track' (deck) vs 'rail' (carrier); its old STAR_NUM_RAILS constant was 56 (tracks + 2)."

