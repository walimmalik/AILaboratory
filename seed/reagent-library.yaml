    catalog:
    - {number: G9241, packSize: '100 assays 96, 400 assays 384'}
    - {number: G9242, packSize: '1000 assays 96, 4000 assays 384'}
    - {number: G9243, packSize: '5000 assays 96, 20000 assays 384'}
    form: frozen_liquid
    storage: {min: {value: '-30', unit: degC}, max: {value: '-10', unit: degC}}
    handlingRules:
    - rule: protect_from_light
      text: Light-sensitive; store in an opaque container
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
    - rule: stable_after_preparation
      text: '>85% light output after 2 months at 4 degC'
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      period: {value: '60', unit: d}
      at: {min: {value: '4', unit: degC}, max: {value: '4', unit: degC}}
    - rule: stable_after_preparation
      text: '>85% light output after 7 days at room temperature'
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      period: {value: '7', unit: d}
    - rule: freeze_thaw_limit
      text: Withstands 4 additional freeze-thaw cycles after the first thaw with no loss; do not refreeze after
        extended storage above recommended temperature
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      cycles: 4
    - rule: thaw
      text: Thaw overnight at 4 degC or in a 22 degC water bath; do not exceed 25 degC
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      at: {max: {value: '25', unit: degC}}
    - rule: equilibrate
      text: ~30 min for 100 mL, ~100 min for 500 mL to reach room temperature
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      period: {value: '30', unit: min}
    - rule: equilibrate
      text: Equilibrate plate and contents to room temperature ~30 min before adding reagent
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      period: {value: '30', unit: min}
    - rule: advice
      text: 'Add volume equal to medium: 100 uL (96-well) or 25 uL (384-well)'
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: false
    - rule: advice
      text: Orbital shaker 2 min to induce lysis
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: false
    - rule: read_within
      text: 10 min at room temperature to stabilise signal
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: true
      after: adding the reagent
      min: {value: '10', unit: min}
    - rule: advice
      text: Half-life of luminescent signal > 3 h
      source: {from: vendor, reference: 'https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en'}
      enforced: false
    liquidType: detergent
    datasheets:
    - https://www.promega.com/-/media/files/resources/protocols/technical-manuals/101/celltiterglo-2-0-assay-protocol.pdf?la=en
    - https://www.promega.com/products/cell-health-assays/cell-viability-and-cytotoxicity-assays/celltiter_glo-2_0-assay/
