# The seed lab's reagents in the library's shape (plan 009a), loaded by `pnpm --filter @ailab/api seed`.
# Made from seed/reagents.yaml (research, with sources) and the lots in seed/inventory.yaml.
#
# products: each entry's datasheets are the evidence for every attribute except those listed under
#   `assumed` (layout choices, liquid types picked from the research's pipetting hints, estimated
#   hazards), which load as assumed. `vendor` is matched by name or created. Kit `components` and
#   recipe `components` name other entries by `component` key. Consumables in kits (plates,
#   sealers, columns, collection tubes) are left out: they are labware and inventory.
# liquid_types: the plan's platform-neutral families (R4); properties are typical values, assumed.
# lots: the demo lab's lots (fictional numbers and dates). The loader records them through
#   reagents.receive_lot, so they arrive as proposals to approve on the Review page.

liquid_types:
- key: aqueous
  label: Aqueous
  attributes:
    base: aqueous
    volatility: low
    foaming: low
    surfaceTension: normal
- key: dmso
  label: DMSO
  attributes:
    base: dmso
    density: {value: '1.1', unit: g/mL}
    viscosity: {value: '2', unit: mPa.s}
    volatility: low
    hygroscopic: true
    notes: Freezes near 18 degC; wets plastics.
- key: glycerol
  label: Glycerol 50%
  attributes:
    base: glycerol
    viscosity: {value: '6', unit: mPa.s}
    density: {value: '1.13', unit: g/mL}
    volatility: low
    notes: Enzyme storage buffers and master mixes; pipette slowly.
- key: serum
  label: Serum or protein-rich
  attributes:
    base: protein_rich
    foaming: high
    notes: FBS, BSA solutions; foams when pipetted fast.
- key: detergent
  label: Detergent-containing
  attributes:
    base: detergent
    foaming: high
    surfaceTension: low
- key: ethanol
  label: Ethanol 80%
  attributes:
    base: ethanol
    volatility: high
    surfaceTension: low
- key: volatile
  label: Volatile organic
  attributes:
    base: volatile_organic
    volatility: high
    surfaceTension: low
- key: cells
  label: Cell suspension
  attributes:
    base: cell_suspension
    notes: Keep cells in suspension; slow aspirate and dispense.
