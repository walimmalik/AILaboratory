# dgretton), which transcribe Hamilton's Venus defaults. Parameters are a read-only
# copy "as reported"; the lab's own Venus export replaces them when it is imported.
# Units: curve and volumes uL, flow rates uL/s, swap speed mm/s, settling time s, heights mm.
